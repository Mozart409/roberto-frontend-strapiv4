name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Type Check and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run unit and integration tests
        run: npm run test

  e2e:
    name: Build and E2E Tests
    runs-on: ubuntu-latest
    needs: check
    # Next prerenders pages from Strapi at build time, so the build needs the
    # read-only API token. Forks and Dependabot PRs don't get repo secrets
    # (Dependabot reads its own secret store), so skip instead of failing.
    env:
      NEXT_PUBLIC_STRAPI_API_TOKEN: ${{ secrets.NEXT_PUBLIC_STRAPI_API_TOKEN }}
      NEXT_PUBLIC_STRAPI_API_URL: ${{ vars.NEXT_PUBLIC_STRAPI_API_URL || secrets.NEXT_PUBLIC_STRAPI_API_URL }}
    steps:
      - name: Check for Strapi token
        id: token
        run: |
          if [ -z "$NEXT_PUBLIC_STRAPI_API_TOKEN" ]; then
            echo "::warning::NEXT_PUBLIC_STRAPI_API_TOKEN not available; skipping build and e2e"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - name: Setup Node.js
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: npm ci

      # Playwright's webServer runs `next build && next start`, so this step
      # is also the build check. The specs only use the request fixture, so
      # no browsers are installed.
      - name: Run E2E tests
        if: steps.token.outputs.present == 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
